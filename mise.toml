[tools]
"github:luau-lang/lute" = "1.0.0"
"github:rojo-rbx/rojo" = "7.7.0"
gh = "2.103.3"
jq = "1.8.2"
pnpm = "12.19.0"
node = { version = "lts" }

# sloptor is the compiler (build + typecheck). The fork is required: upstream
# v3.0.0-beta.4 has no `rbxts.runtimeRoots`, and the fork also carries the
# transformer parity fixes (no `send(nil, ...)`, `_exitType` guards restored).
#
# The `-fork.N` suffix keeps the fork's release from colliding with upstream's
# own v3.0.0-beta.4 tag, which the fork inherits.
[tools."github:lisachandra/sloptor"]
version = "3.0.0-beta.4-fork.1"

[tools."github:lisachandra/sloptor".platforms]
windows-x64 = { asset_pattern = "*windows-amd64.zip" }
linux-x64 = { asset_pattern = "*linux-amd64.tar.gz" }
linux-arm64 = { asset_pattern = "*linux-arm64.tar.gz" }
darwin-arm64 = { asset_pattern = "*darwin-arm64.tar.gz" }

# ree (roblox-engine-emulator) backs the offline test lane. It builds from a
# release fork: tags carry the upstream commit the binaries were cut from;
# scripts/emulator/reflection.json must be re-copied from the same commit on
# every bump.
[tools."github:lisachandra/roblox-engine-emulator"]
version = "0.1.0-771754c6"

[tools."github:lisachandra/roblox-engine-emulator".platforms]
windows-x64 = { asset_pattern = "*windows-x86_64*.zip" }
linux-x64 = { asset_pattern = "*linux-x86_64*.tar.gz" }
linux-arm64 = { asset_pattern = "*linux-arm64*.tar.gz" }
darwin-arm64 = { asset_pattern = "*darwin-arm64*.tar.gz" }

[env]
_.file = { path = ".env", redact = true }
