packages:
  - 'packages/*'
  - 'test/*'

autoInstallPeers: true

catalog:
  "@changesets/changelog-github": 0.6.0
  "@changesets/cli": 2.31.0
  "@isentinel/jest-roblox": 0.2.5
  "@isentinel/roblox-ts": 3.2.0
  '@isentinel/tsconfig': 1.2.0
  "@rbxts/centurion": latest
  "@rbxts/compiler-types": latest
  "@rbxts/jest": latest
  "@rbxts/jest-globals": latest
  "@rbxts/log": latest
  "@rbxts/matter": latest
  "@rbxts/react": latest
  "@rbxts/react-roblox": latest
  "@rbxts/rewire": latest
  "@rbxts/services": latest
  "@rbxts/types": latest
  husky: 9.1.7
  io-serve: 1.1.2
  shx: 0.4.0
  typescript: =5.9.3
catalogMode: prefer
cleanupUnusedCatalogs: true

configDependencies:
  "@pnpm/plugin-trusted-deps": 0.2.0+sha512-jqiCC8kyrwOERwMWPo2RB1YlDMMS5WsPSA8Uwi3EXAYwyOSNtqKhrB9bs543JGUiz4yaA9h6nE3q98fG14AEyQ==
ignoreWorkspaceRootCheck: true

onlyBuiltDependencies:
  - unrs-resolver
saveExact: true
shellEmulator: true
trustPolicy: no-downgrade

trustPolicyExclude:
  - eslint-config-prettier@9.1.2
  - semver@5.7.2
  - chokidar@4.0.3

updateConfig:
  ignoreDependencies:
    - "@types/node"
