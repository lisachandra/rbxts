packages:
  - 'packages/*'
  - 'test/*'

autoInstallPeers: true

catalog:
  "@changesets/changelog-github": 0.6.0
  "@changesets/cli": 2.31.0
  "@flamework/core": 1.3.2
  "@isentinel/jest-roblox": 0.2.5
  '@isentinel/tsconfig': 1.2.0
  "@lisachandra/constant": "github:lisachandra/constant#path:packages/constant"
  "@rbxts/centurion": 1.0.1
  "@rbxts/centurion-ui": 1.0.8
  "@rbxts/compiler-types": latest
  "@rbxts/crate": 1.0.3-rc.1
  "@rbxts/iris": 2.3.1-ts.1
  "@rbxts/janitor": 1.18.3-ts.0
  "@rbxts/jest": 3.13.3-ts.1
  "@rbxts/jest-globals": 3.13.3-ts.1
  "@rbxts/lapis": 0.3.8
  "@rbxts/lapis-mockdatastore": 0.3.7
  "@rbxts/lemon-signal": 1.2.0
  "@rbxts/log": 0.6.3
  "@rbxts/luau-polyfill": latest
  "@rbxts/matter": github:matter-ecs/matter-types
  "@rbxts/message-templates": 0.3.2
  "@rbxts/object-cache": 1.4.5
  "@rbxts/object-utils": 1.0.4
  "@rbxts/plasma": 0.4.5
  "@rbxts/pretty-react-hooks": 0.6.4
  "@rbxts/rbxts-hashlib": 1.0.2
  "@rbxts/react": 17.3.7-ts.1
  "@rbxts/react-devtools-core": 17.3.7-ts.1
  "@rbxts/react-globals": 17.3.7-ts.1
  "@rbxts/react-roblox": 17.3.7-ts.1
  "@rbxts/react-roblox-fire": 0.1.4
  "@rbxts/react-testing-library": 12.1.5-rc.5
  "@rbxts/regexp": latest
  "@rbxts/rewire": 0.3.0
  "@rbxts/serio": 1.2.5
  "@rbxts/services": latest
  "@rbxts/sift": 0.0.11
  "@rbxts/t": 3.2.1
  "@rbxts/tether": 1.4.17
  "@rbxts/types": 1.0.925
  "@rbxts/validate-tree": 2.0.2
  husky: 9.1.7
  io-serve: 1.1.2
  jiti: 2.6.1
  rbxts-transformer-flamework: 1.3.2
  roblox-ts: 3.0.0
  shx: 0.4.0
  type-fest: 5.6.0
  typescript: =5.5.3
catalogMode: prefer
cleanupUnusedCatalogs: true

configDependencies:
  "@pnpm/plugin-trusted-deps": 0.2.0+sha512-jqiCC8kyrwOERwMWPo2RB1YlDMMS5WsPSA8Uwi3EXAYwyOSNtqKhrB9bs543JGUiz4yaA9h6nE3q98fG14AEyQ==
ignoreWorkspaceRootCheck: true

onlyBuiltDependencies:
  - unrs-resolver
  - "@lisachandra/constant"

patchedDependencies:
  '@rbxts/centurion': patches/@rbxts__centurion.patch

publicHoistPattern:
  - "*@rbxts*"
  - "*@lisachandra*"
  - "*@flamework*"
  - "*@rbxts-js*"
  - "*eslint*"
saveExact: true
shellEmulator: true
trustPolicy: no-downgrade

trustPolicyExclude:
  - eslint-config-prettier@9.1.2
  - semver@5.7.2
  - chokidar@4.0.3

updateConfig:
  ignoreDependencies:
    - "@types/node"
