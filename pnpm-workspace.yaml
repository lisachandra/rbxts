publicHoistPattern:
  - '*@rbxts*'
  - '*@lisachandra*'
  - '*@flamework*'
  - '*@rbxts-js*'
  - '*eslint*'

saveExact: true

shellEmulator: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - eslint-config-prettier@9.1.2
  - semver@5.7.2
  - chokidar@4.0.3

updateConfig:
  ignoreDependencies:
    - '@types/node'
