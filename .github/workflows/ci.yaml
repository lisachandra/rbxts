name: Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_run:
    workflows: [Dependabot PR Check]
    types:
      - completed

permissions:
  actions: read
  contents: read
  packages: read

env:
  CI: true
  HUSKY: 0

jobs:
  badge:
    needs: [test]
    # Write badges even when the test job failed: a red "tests: failed" badge is
    # the signal. Gating on success left every badge stuck at "pending" and hid
    # real breakage.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: ci
    env:
      # `secrets` is not available in `if:` expressions, so fold the check into
      # env and test that instead. Accept either variable name: the workflows
      # used `BADGE_GIST_ID` while three repos define `CI_BADGE_GIST_ID`.
      HAS_GIST: ${{ secrets.GIST_SECRET != '' && (vars.BADGE_GIST_ID != '' || vars.CI_BADGE_GIST_ID != '') }}
      GIST_ID: ${{ vars.BADGE_GIST_ID || vars.CI_BADGE_GIST_ID }}
    steps:
      - name: Bootstrap local actions
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions
          sparse-checkout-cone-mode: false
          fetch-depth: 0

      - id: checkout
        name: Checkout
        uses: ./.github/actions/checkout

      # No Setup step: badges read `package.json` and the job result only. A
      # badge must not depend on the toolchain install that it reports on.
      - id: badge_info
        name: Get Badge Information
        run: |
          echo "test_results=${{ needs.test.result }}" >> "$GITHUB_OUTPUT"
          if [ "${{ needs.test.result }}" = "success" ]; then
            echo "test_color=hsl(120, 100%, 40%)" >> "$GITHUB_OUTPUT"
          else
            echo "test_color=hsl(0, 100%, 40%)" >> "$GITHUB_OUTPUT"
          fi

          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          COVERAGE="${{ needs.test.outputs.coverage }}"
          if [ -z "$COVERAGE" ] || [ "$COVERAGE" = "null" ]; then
            echo "coverage=n/a" >> "$GITHUB_OUTPUT"
          else
            echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Test Coverage Badge
        if: ${{ env.HAS_GIST == 'true' && steps.badge_info.outputs.coverage != 'n/a' }}
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          filename: test-coverage-badge.svg
          gistID: ${{ env.GIST_ID }}
          label: test coverage
          maxColorRange: 100
          message: ${{ steps.badge_info.outputs.coverage }}%
          minColorRange: 0
          valColorRange: ${{ steps.badge_info.outputs.coverage }}

      # Report the gap honestly rather than painting a fake 0%.
      - name: Create Coverage Unavailable Badge
        if: ${{ env.HAS_GIST == 'true' && steps.badge_info.outputs.coverage == 'n/a' }}
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          color: lightgrey
          filename: test-coverage-badge.svg
          gistID: ${{ env.GIST_ID }}
          label: test coverage
          message: n/a

      - name: Create Test Results Badge
        if: ${{ env.HAS_GIST == 'true' }}
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          color: ${{ steps.badge_info.outputs.test_color }}
          filename: test-results-badge.svg
          gistID: ${{ env.GIST_ID }}
          label: tests
          message: ${{ steps.badge_info.outputs.test_results }}

      - name: Create Version Badge
        if: ${{ env.HAS_GIST == 'true' }}
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          color: blue
          filename: version-badge.svg
          gistID: ${{ env.GIST_ID }}
          label: version
          message: ${{ steps.badge_info.outputs.version }}

  lint:
    runs-on: ubuntu-latest
    environment:
      name: ci
    steps:
      - name: Bootstrap local actions
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions
          sparse-checkout-cone-mode: false
          fetch-depth: 0

      - id: checkout
        name: Checkout
        uses: ./.github/actions/checkout

      - name: Setup
        uses: ./.github/actions/setup
        with:
          ref: ${{ steps.checkout.outputs.ref }}

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

  test:
    needs: [lint]
    runs-on: ubuntu-latest
    environment:
      name: ci
    concurrency:
      group: luau-execution
      cancel-in-progress: false
    outputs:
      coverage: ${{ steps.extract_coverage.outputs.coverage }}
    steps:
      - name: Bootstrap local actions
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions
          sparse-checkout-cone-mode: false
          fetch-depth: 0

      - id: checkout
        name: Checkout
        uses: ./.github/actions/checkout

      - name: Setup
        uses: ./.github/actions/setup
        with:
          ref: ${{ steps.checkout.outputs.ref }}

      - name: Build
        run: pnpm build

      - id: run_tests
        name: Test
        run: |
          set -o pipefail
          pnpm install
          # No `--include-workspace-root`: the root `test` script is itself a
          # recursive `pnpm -r test`, so including it would re-enter every
          # package — including the one excluded below.
          #
          # Coverage reporters are a jest-roblox flag. `@lisachandra/sandcastle`
          # runs vitest, which rejects them outright ("Unknown option
          # --coverageReporters"), so it runs separately without the flags.
          pnpm -r --filter '!@lisachandra/sandcastle' --stream --workspace-concurrency=1 \
            test --coverageReporters json-summary --coverageReporters json | tee test_results.txt
          pnpm --filter @lisachandra/sandcastle test | tee -a test_results.txt
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_PLACE_ID }}
          ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID }}

      - id: extract_coverage
        name: Extract coverage
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE=$(node -e "const fs=require('fs'); const summary=JSON.parse(fs.readFileSync('coverage/coverage-summary.json','utf8')); process.stdout.write(String(summary.total.lines.pct));")
          else
            # No summary is not 0% coverage — it means coverage did not run.
            # Leave it empty so the badge reports n/a instead of a false zero.
            COVERAGE=""
          fi
          echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"
        shell: bash
